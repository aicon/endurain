name: Publish unofficial summary-card image

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-arch-images:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: 0.20.1-place

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login \
            --username "${{ github.actor }}" \
            --password-stdin \
            ghcr.io

      - name: Publish architecture image
        run: |
          set -eu
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file docker/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/aicon/endurain" \
            --label "org.opencontainers.image.description=Unofficial Endurain v0.20.1 fork. Summary cards keep heart rate and elevation. The header shows the recording device and the settlement with the country. A slow climb stays in the elevation total. Not an official Endurain image." \
            --label "org.opencontainers.image.version=0.20.1-summary" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}-${{ matrix.arch }}" \
            --push \
            .

  publish-manifests:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build-arch-images
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: 0.20.1-place

    steps:
      - name: Login to GitHub Container Registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login \
            --username "${{ github.actor }}" \
            --password-stdin \
            ghcr.io

      - name: Publish summary-card manifest
        run: |
          set -eu
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-arm64"

      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/endurain/visibility -f visibility=public
